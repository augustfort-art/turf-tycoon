<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turf & Tycoon</title>
<meta name="theme-color" content="#0e3b2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Turf & Tycoon">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>:root{--g:#0e3b2c;--g2:#16513d;--g3:#1f6b50;--paper:#f6f0e2;--card:#fffdf7;--ink:#1f1b14;--brass:#b98a2f;--brass2:#e2b858;--muted:#7a705c;--line:#e3d8bf;--red:#a3262e;--good:#2b6e3f;--blue:#2a5a8a;--warn:#a5671a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--g);-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;color:var(--ink);font-family:'Barlow',system-ui,sans-serif;font-size:15px;line-height:1.35}
body{background:var(--paper);min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit}
#app{max-width:620px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-top:calc(env(safe-area-inset-top) + var(--toph0,54px));padding-bottom:calc(150px + env(safe-area-inset-bottom))}
#top{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--g);color:#f6ecd2;display:flex;justify-content:space-between;align-items:center;padding:10px max(14px,calc((100vw - 620px) / 2 + 14px));padding-top:calc(env(safe-area-inset-top) + 10px);box-shadow:0 2px 0 var(--brass)}
.tl{display:flex;gap:10px;align-items:center}.sn{font-family:'DM Serif Display',serif;font-size:19px;letter-spacing:.2px}.sd{font-size:12px;opacity:.8}
.tr{text-align:right}.cash{font-family:'Barlow Condensed';font-weight:700;font-size:21px;color:var(--brass2)}.cash.neg{color:#ff8b8b}.rep{font-size:11.5px;opacity:.75}
canvas.silk{border-radius:50%;box-shadow:0 0 0 1.5px rgba(255,255,255,.6)}
#view{padding:0 12px 12px}
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;background:#fffaf0;border-top:1px solid var(--line);padding-bottom:max(4px,calc(env(safe-area-inset-bottom) - 14px))}
.tab{flex:1;max-width:124px;background:none;border:0;padding:7px 0 8px;font-size:11.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;position:relative}
.tab .ti{font-size:19px;filter:grayscale(.6);opacity:.75}.tab.on{color:var(--g)}.tab.on .ti{filter:none;opacity:1}
.tab em{position:absolute;top:3px;right:22%;background:var(--red);color:#fff;font-style:normal;font-size:10px;border-radius:9px;min-width:16px;padding:0 4px}
#advbar{position:fixed;left:0;right:0;bottom:calc(52px + max(4px,calc(env(safe-area-inset-bottom) - 14px)));z-index:29;display:flex;justify-content:center;padding:0 12px 8px;pointer-events:none}
.adv{pointer-events:auto;width:100%;max-width:596px;border:0;border-radius:14px;background:linear-gradient(180deg,var(--g3),var(--g));color:#fff;padding:9px 14px;display:flex;flex-direction:column;align-items:center;box-shadow:0 6px 18px rgba(14,59,44,.35),inset 0 0 0 1.5px var(--brass)}
.adv span{font-family:'DM Serif Display';font-size:18px}.adv small{font-size:11.5px;opacity:.85}
.adv:active{transform:translateY(1px)}
h2.sec{font-family:'DM Serif Display';font-weight:400;font-size:20px;margin:18px 2px 8px;color:var(--g);display:flex;align-items:center;gap:8px}h2.sec span{font-family:'Barlow';font-size:12px;background:var(--g);color:#fff;border-radius:10px;padding:1px 8px}
h3.sub{font-size:14px;font-weight:700;color:var(--g);margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.hcard:active{background:#f8f1e0}.hn{font-family:'DM Serif Display';font-size:17px}.hs{font-size:12.5px;color:var(--muted)}.hst{font-size:13px;margin-top:3px}
.hc-r{text-align:right;min-width:78px;display:flex;flex-direction:column;align-items:flex-end;gap:1px}.rec{font-family:'Barlow Condensed';font-size:15px;font-weight:600}.earn{font-family:'Barlow Condensed';font-weight:700;font-size:17px;color:var(--g2)}
.fit{width:64px;height:5px;border-radius:3px;background:#e8dfc9;overflow:hidden;margin-top:4px}.fit i{display:block;height:100%}
.bt{font-family:'Barlow';font-size:10.5px;font-weight:700;background:var(--brass);color:#fff;border-radius:4px;padding:1px 5px;vertical-align:middle}
.fig{font-family:'Barlow Condensed';color:var(--g)}
.good{color:var(--good)}.bad{color:var(--red)}.warn{color:var(--warn)}.info{color:var(--blue)}.muted{color:var(--muted)}.ok{color:var(--good);font-weight:600}.no{color:var(--red)}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}.btn:disabled{opacity:.4}
.btn.ghost{background:transparent;color:var(--g);box-shadow:inset 0 0 0 1.5px var(--g)}.btn.sm{padding:6px 11px;font-size:13.5px}.btn.xs{padding:4px 8px;font-size:12px}
.btn.big{width:100%;padding:13px;font-size:16px;margin-top:12px;background:linear-gradient(180deg,var(--g3),var(--g));box-shadow:inset 0 0 0 1.5px var(--brass)}
.btn.wide{width:100%;margin:4px 0 10px}.btn.hi{background:var(--brass);color:#fff}.btn.danger{color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}.btn.on{background:var(--brass)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.btnrow .inp{flex:1}
.acts{display:flex;flex-direction:column;gap:7px;padding:4px 0}.acts .btn{text-align:left}
.toggle-row{background:#f3ead4;border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.seg{display:flex;background:#ebe1c9;border-radius:10px;padding:3px;margin:4px 0 10px}.seg button{flex:1;border:0;background:none;padding:7px 4px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}.seg button.on{background:var(--card);color:var(--g);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer}.chip.on{background:var(--g);color:#fff;border-color:var(--g)}.chip.sm{padding:4px 10px;font-size:12px}
.rrow{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer}
.rr-t{font-weight:600;font-size:14px}.rr-s{font-size:12px;color:var(--muted)}.rr-m{font-size:12px;color:var(--good);font-weight:600}.rr-e{font-size:12px}.rr-r{text-align:right;display:flex;flex-direction:column;min-width:64px}.rr-r b{font-family:'Barlow Condensed';font-size:16px}.rr-r small{font-size:11px;color:var(--muted)}
.gr{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;background:#776;color:#fff}.gr.g1{background:var(--brass)}.gr.g2{background:#8a8f99}.gr.g3{background:#9a6b45}
.note{background:#efe6cf;border-radius:10px;padding:8px 11px;font-size:13px;margin:6px 0 10px}.note.muted{background:transparent;padding:2px 2px 8px}
.warnbox{background:#fbe9d2;border:1px solid #efc58e;border-radius:9px;padding:8px 10px;font-size:13px;margin:6px 0}
.banner{background:#fff4d6;border:1px solid var(--brass2);border-radius:10px;padding:9px 11px;margin-bottom:10px;font-size:14px;cursor:pointer}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}.empty .big{font-size:48px}.empty a{color:var(--g);font-weight:600;text-decoration:underline;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.stats div{text-align:center;background:#f5edda;border-radius:8px;padding:6px 2px}.stats b{display:block;font-family:'Barlow Condensed';font-size:18px}.stats span{font-size:11px;color:var(--muted)}
.repbar{height:7px;background:#e8dfc9;border-radius:4px;overflow:hidden;margin:6px 0}.repbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),var(--brass2))}
.fin{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px}.fc h4{margin:0 0 5px;font-size:13.5px}.fc div{display:flex;justify-content:space-between;gap:4px;border-bottom:1px dotted var(--line);padding:2px 0}
.net{text-align:right;font-weight:700;margin:6px 2px;font-family:'Barlow Condensed';font-size:18px}
.erow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line)}
.news{font-size:13px;padding:6px 2px;border-bottom:1px solid var(--line)}.news span{color:var(--muted);font-size:11.5px;margin-right:6px}.news.good{color:#1f4f30}.news.bad{color:#7e1f25}
/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,25,18,.55);display:flex;align-items:flex-end;justify-content:center}#modal.hidden{display:none}
.sheet{background:var(--paper);width:100%;max-width:620px;max-height:92vh;max-height:calc(100dvh - env(safe-area-inset-top) - 10px);border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -6px 30px rgba(0,0,0,.25)}
.sheet-h{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border-bottom:2px solid var(--brass);background:var(--g);color:#f6ecd2;border-radius:18px 18px 0 0}
.sheet-t{flex:1;font-family:'DM Serif Display';font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-h button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;width:32px;height:30px;font-size:15px}
.sheet-b{overflow-y:auto;padding:12px 14px calc(24px + env(safe-area-inset-bottom))}
.pad{padding:4px 2px}.lab{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}
.inp{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 11px;font:inherit;background:#fff}.inp.code{height:140px;font-family:monospace;font-size:11px;word-break:break-all}
.radio{display:block;padding:7px 9px;border-radius:9px;background:var(--card);border:1px solid var(--line);margin-bottom:5px;font-size:14px}.radio.dis{opacity:.5}
.fees{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:12px;font-size:13.5px}.fees div{display:flex;justify-content:space-between;padding:2px 0}.fees .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:5px;font-weight:700}
.hhead{margin-bottom:8px}.ped{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14px}.ped div{padding:2px 0}.ped span{display:inline-block;width:40px;font-size:12px;color:var(--muted)}.ped small{color:var(--muted);font-size:12px;display:block;margin-left:40px}
.take{background:#fff8e6;border-left:3px solid var(--brass);border-radius:6px;padding:8px 11px;margin:6px 0 10px;font-size:14px}.take p{margin:3px 0;font-style:italic}.tk-h{font-weight:700;font-size:12.5px;color:var(--warn)}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13.5px;margin:6px 0}dl.kv dt{color:var(--muted);font-size:12.5px}dl.kv dd{margin:0}
table.dtab{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card);border-radius:8px;overflow:hidden}.dtab th{text-align:left;font-size:11px;font-weight:600;color:var(--muted);padding:5px;border-bottom:1px solid var(--line)}.dtab td{padding:5px;border-bottom:1px solid #f0e8d4;vertical-align:top}.dtab tr.w td{background:#f3f8ef}.dtab tr.me td{background:#fff4d6}.cm{font-size:11px;color:var(--muted)}.bullet{color:var(--red)}
.pn{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:4px;font-size:11.5px;font-weight:700;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);margin-right:3px}.pn.me{box-shadow:0 0 0 2px var(--brass2)}.pn.more{background:none;box-shadow:none}
.rinfo{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13.5px;line-height:1.5}
.salehead{background:var(--g);color:#f6ecd2;border-radius:12px;padding:12px;margin-bottom:10px}.sh-k{font-size:12px;opacity:.75}.sh-n{font-family:'DM Serif Display';font-size:20px}
.auc{background:var(--g);color:#fff;border-radius:14px;padding:16px;text-align:center}.auc-p{font-family:'Barlow Condensed';font-size:42px;font-weight:700;color:var(--brass2)}.auc-w{font-size:14px;margin-bottom:6px}.auc-w .good{color:#9be29b}.auc-log{font-size:12.5px;opacity:.85;text-align:left;background:rgba(0,0,0,.18);border-radius:8px;padding:6px 9px}
.resc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}.resc.win{border-color:var(--brass);background:#fff8e3}.resc.itm{border-color:#bcd2b5}
.resc-h{display:flex;gap:10px;align-items:center;margin-bottom:4px}.fpos{font-family:'DM Serif Display';font-size:24px;color:var(--g);min-width:44px}.resc .btn{margin-top:7px}
.racehost{min-height:300px}.race-head{margin-bottom:6px}.rh-title{font-weight:700;font-size:14px}.rh-sub{font-size:12px;color:var(--muted)}
.race-cv{display:block;margin:0 auto;border-radius:12px;background:#3a7a49}.race-order{display:flex;gap:3px;justify-content:center;margin:8px 0 4px;min-height:22px}
.race-call{background:#14261d;color:#f1ead6;border-radius:10px;padding:9px 11px;font-size:14px;min-height:62px}.race-call b{color:var(--brass2)}.me-call{display:block;color:#9be29b;font-size:13px;margin-top:3px}
.race-ctl{display:flex;gap:6px;justify-content:center;margin:8px 0}.race-ctl .btn{min-width:48px}
.official{text-align:center;font-family:'Barlow Condensed';font-weight:700;letter-spacing:3px;background:#c22;color:#fff;border-radius:6px;padding:3px;margin:10px 0 6px}
table.rtab{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card)}.rtab th{font-size:10.5px;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px}.rtab td{padding:4px;border-bottom:1px solid #eee3cc;vertical-align:top}.rtab tr.me td{background:#fff4d6;font-weight:600}.rtab .nm{max-width:150px}
#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-20px);background:#14261d;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}
/* new game */
body.newgame #app{padding-bottom:30px}
.hero{background:radial-gradient(120% 90% at 50% 0%,var(--g3),var(--g));color:#f6ecd2;border-radius:16px;padding:28px 18px 22px;text-align:center;margin-bottom:12px;box-shadow:inset 0 0 0 2px var(--brass)}
.hero h1{font-family:'DM Serif Display';font-weight:400;font-size:40px;margin:2px 0 6px;color:var(--brass2)}.hero p{margin:0;opacity:.9}.hero-k{letter-spacing:4px;font-size:11px;opacity:.7}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.opt{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;gap:2px;text-align:center;cursor:pointer}.opt small{font-size:11px;color:var(--muted)}.opt.on{border-color:var(--g);background:#eaf2ec}
.silkpick{display:flex;gap:14px;align-items:flex-start}.silkprev{padding-top:6px}.sw-l{font-size:11px;color:var(--muted);margin:4px 0 3px}.sw{display:flex;flex-wrap:wrap;gap:5px}.swc{width:24px;height:24px;border-radius:50%;border:1px solid rgba(0,0,0,.2);cursor:pointer}.swc.on{box-shadow:0 0 0 2.5px var(--brass)}
.help p{font-size:14px;margin:8px 0}
input[type=checkbox],input[type=radio]{accent-color:var(--g)}
.cutline{text-align:center;color:var(--red);font-size:11px;letter-spacing:2px;background:#fbeaea}
.bt.own{background:var(--blue)}
.bk{display:flex;flex-direction:column;gap:4px;align-items:flex-end}

#advbar{gap:8px}
.advice{pointer-events:auto;border:0;border-radius:14px;background:#fff8e3;box-shadow:inset 0 0 0 1.5px var(--brass),0 6px 18px rgba(14,59,44,.25);font-size:22px;width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 0}
.advice small{font-size:10.5px;font-weight:700;color:var(--g)}
.adv-i{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}.adv-ic{font-size:20px;min-width:26px}.adv-t{font-size:14px}.adv-t .btn{margin-top:6px}
/* v4: Beyer figure in the right margin, like a DRF past-performance line */
.dtab.pp td.figc { text-align: right; font-size: 1.05em; border-left: 1px solid rgba(0,0,0,.12); }
.dtab.pp td.figc b { color: #111; }
.dtab.fld a, .sub a { text-decoration: underline; cursor: pointer; }
.sub small { font-weight: 400; opacity: .7; margin-left: 6px; }
.dtab.fld td:last-child, .dtab.fld td:nth-child(4) { white-space: nowrap; }

/* ===== v2 layout system ===== */
.subnav{position:sticky;top:calc(env(safe-area-inset-top) + var(--toph0,54px));z-index:15;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;background:var(--paper);margin:0 -12px 8px;padding:8px 12px 0;border-bottom:1px solid var(--line)}
.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:none;border:0;background:none;padding:8px 10px 9px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.subnav button.on{color:var(--g);border-bottom-color:var(--brass)}
.subnav em{font-style:normal;font-size:10.5px;background:var(--g);color:#fff;border-radius:8px;padding:0 6px;margin-left:5px;vertical-align:1px}
#view>.seg:first-child,#view>.dash:first-child{margin-top:10px}
.seg button small{display:block;font-size:11px;font-weight:500;opacity:.8}
.fbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px -12px;padding:0 12px 2px}.fbar::-webkit-scrollbar{display:none}
.pill{flex:none;display:flex;align-items:baseline;gap:5px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.pill span{color:var(--muted);font-size:12px}.pill b{font-weight:600}.pill.set{border-color:var(--g);background:#e9f1ec}.pill.set b{color:var(--g)}
.chip i{font-style:normal;opacity:.6;font-size:11px;margin-left:2px}
.choices{display:flex;flex-direction:column;gap:6px}.choice{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 13px;font-size:15px;cursor:pointer}.choice.on{border-color:var(--g);background:#e9f1ec;font-weight:700;color:var(--g)}
.tgl{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin:4px 2px 8px}
/* race rows: saddlecloth number tile is the program device */
.race{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:6px;display:flex;gap:10px;align-items:center;cursor:pointer}
.race:active{background:#f7f0de}.race.done{opacity:.6}
.rnum{flex:none;width:30px;height:34px;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:700;font-size:17px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.rnum small{font-size:9px;font-weight:600;margin-top:-3px;opacity:.75}
.rnum.hip,.rnum.cal{background:#efe6cf;color:var(--g);width:40px;font-size:15px}
.rc{flex:1;min-width:0}.rt{font-weight:600;font-size:14px;line-height:1.25}.rs{font-size:12px;color:var(--muted);margin-top:1px}.rm{font-size:12px;color:var(--good);font-weight:600}.re{font-size:12px;margin-top:1px}

  else if (opts.push === false) { } else UI.stack = [];
  UI.curFn = opts.fn || null;
  $('.sheet-t').innerHTML = title; $('.sheet-b').innerHTML = html; $('#modal').classList.remove('hidden'); $('.sheet-b').scrollTop = 0; $('#back').style.visibility = UI.stack.length ? 'visible' : 'hidden'; paintSilks($('.sheet-b'));
}
function closeModal() { if (UI.anim) { UI.anim.stop(); UI.anim = null; } UI.holding = false; $('#modal').classList.add('hidden'); UI.stack = []; UI.curFn = null; render(); }
function backModal() { if (UI.anim) { UI.anim.stop(); UI.anim = null; } const p = UI.stack.pop(); if (!p) return closeModal(); if (p.fn) { UI.curFn = p.fn; p.fn(true); } else { $('.sheet-t').innerHTML = p.t; $('.sheet-b').innerHTML = p.b; UI.curFn = null; } $('#back').style.visibility = UI.stack.length ? 'visible' : 'hidden'; paintSilks($('.sheet-b')); }

// ---------- STABLE ----------
function horseStatus(h) {
  const ent = G.entries.filter(e => e.hid === h.id).map(e => raceById(e.rid)).filter(Boolean).sort((a, b) => awOf(a.yr, a.wk) - awOf(b.yr, b.wk))[0];
  if (h.inj) return `<span class="bad">🩹 ${esc(h.inj.n)}${h.inj.sev < 3 ? ' · back ~' + shortDate(...awToYW(h.inj.until)) : ''}</span>`;
  const con = G.consign.find(c => c.hid === h.id); if (con) return `<span class="info">🔨 Consigned to ${SALES.find(s => s.id === con.sale).n}</span>`;
  if (h.status === 'race') {
    if (ent) return `<span class="good">🏁 ${shortDate(ent.yr, ent.wk)}: ${esc(raceShort(ent))} · ${TRACKS[ent.trk].n} ${distStr(ent.dist)}${ent.surf === 'T' ? ' turf' : ''}</span>`;
    const days = (AW() - h.lastRace) * 7; const t = trainer(h.trainer);
    if (h.needTrainer) return '<span class="bad">Choose a trainer</span>';
    if (!h.name) return '<span class="bad">Needs a name before racing</span>';
    if (ageOf(h) === 2 && G.wk < 14) return `<span>Breezing at ${t.n}'s barn · 2yo racing starts in April</span>`;
    if (h.fit < 80) return `<span>Building fitness (${Math.round(h.fit)}%)</span>`;
    if (h.starts && days < 21) return `<span>Freshening · ran ${days} days ago</span>`;
    return `<span class="${h.auto.on ? 'info' : 'warn'}">${h.auto.on ? 'Trainer picking a spot' : 'Ready to run — find a race'}</span>`;
  }
  if (h.status === 'farm') return '<span>Turned out at the farm</span>';
  if (h.status === 'young') return h.pre ? '<span>In pre-training (being broken)</span>' : `<span>At the farm (${STATE_N[h.farm || G.home]})</span>`;
  if (h.status === 'mare') { if (h.preg) return `<span class="good">In foal to ${esc(stallion(h.preg.sid)?.name)} · due ${shortDate(...awToYW(h.preg.due))}</span>`; if (h.cover) return '<span class="info">Covered · awaiting check</span>'; return `<span>${inSeason() ? '<span class="warn">Open — ready to breed</span>' : 'Open'}</span>`; }
  if (h.status === 'stud') { const s = stallion(h.sid); return `<span class="good">Standing at ${fmt$(s?.fee || 0)} · ${STATE_N[s?.st]}</span>`; }
  return '';
}

function openEnter(hid, rid) {

  <div class="note">Weather: ${wxTag(r)}${(() => { const t = trainer(h.trainer); const k = clamp(h.know * TRAINER_TIERS[t.tier].read, 0, 1); return r.surf !== 'S' && k > 0.35 && Math.abs(h.mud) > 0.3 ? ` — ${esc(t.n)}: “${h.mud > 0 ? 'loves an off track' : 'hates the slop'}.”` : ''; })()}</div>

  ${!noLasix ? `<label class="radio"><input type="checkbox" id="en-lasix" ${h.bleedKnown ? 'checked' : ''}> Race on Lasix (anti-bleeding medication)</label>` : '<div class="note muted">No Lasix: 2yo races and stakes are run medication-free.</div>'}

  <div class="fees">${notes.length ? notes.map(([n, v]) => `<div><span>${n}</span><b>${fmt$(v)}</b></div>`).join('') : '<div><span>Overnight races have no entry fee</span><b>$0</b></div>'}<div class="tot"><span>Due now</span><b>${fmt$(fee)}</b></div><div class="muted"><span>On race day: jockey mount fee or 10% of winnings, 10% to trainer.</span></div></div>

function trainerAcceptsClaim(t) { return t.tier <= 2 || G.rep >= TRAINER_TIERS[t.tier].rep; }

// ---------- SALES ----------
function lotTitle(l) { const h = l.h; const k = { Y: 'yearling', '2': '2yo', W: 'weanling', M: 'broodmare', R: ageOf(h) + 'yo' }[l.h.lotKind || 'Y'] || ''; return `Hip ${h.hip} · ${h.name ? esc(h.name) + ' · ' : ''}${k} ${h.sex === 'F' ? (k === 'broodmare' ? '' : 'filly') : 'colt'}`; }
function estRange(m) { return `${fmtK(roundBid(m * 0.6))}–${fmtK(roundBid(m * 1.5))}`; }
function breezeStr(b) { const w = Math.floor(b), fr = Math.round((b - w) * 5); return w + (fr ? ` ${fr}/5` : ''); }
function damText(h) {
  const q = h.dq; const r = srng('dam' + h.id);
  const rec = q >= 84 ? 'Stakes winner' : q >= 79 ? 'Stakes-placed winner' : q >= 73 ? 'Winner' : q >= 69 ? 'Placed' : 'Unraced';
  const prod = q + gauss(0, 3, r) >= 81 ? 'Dam of a stakes winner. ' : q + gauss(0, 3, r) >= 76 ? 'Dam of winners. ' : '';
  const fam = q + gauss(0, 4, r) >= 82 ? `Second dam produced a Grade ${pick([1, 2, 3], r)} winner.` : q + gauss(0, 4, r) >= 75 ? 'Family of stakes horses.' : 'Modest family.';
  return `${rec}. ${prod}${fam}`;
}
function openLot(i, re) {
  const l = G.saleLots[i]; const h = l.h; const sale = saleThisWeek(); const s = stallion(h.sireId);
  let o = `<div class="ped"><div><span>Sire</span><b>${esc(h.sireName)}</b> <small>${fmt$(s?.fee || h.sireFee)} · ${s ? sireStats(s).txt : ''}</small></div><div><span>Dam</span><b>${esc(h.damName)}</b> <small>by ${esc(h.damsireName)} · ${damText(h)}</small></div></div>
  <dl class="kv"><dt>Foaled</dt><dd>${h.foal} · ${h.color} · ${STATE_N[h.bred]}-bred${SB_STATES.includes(h.bred) ? ' (state-bred races eligible)' : ''}</dd><dt>Conformation</dt><dd>${['', 'D — some faults', 'C — average', 'B — correct', 'A — outstanding'][h.conf]}</dd>
  ${h.breeze ? `<dt>Under-tack show</dt><dd>Breezed an eighth in <b>:${breezeStr(h.breeze)}</b> (sale-topping colts often go :10 flat or faster)</dd>` : ''}
  ${h.starts || h.lotKind === 'R' || h.lotKind === 'M' ? `<dt>Race record</dt><dd>${rec(h)} · ${fmt$(h.earn)}${h.pp.length ? ' · figs ' + h.pp.slice(0, 4).map(p => p.fig).join(', ') : ''}${h.blackType ? ' · ' + (h.blackType === 'SW' ? 'stakes winner' : 'stakes-placed') : ''}</dd>` : ''}
  ${h.preg ? `<dt>Status</dt><dd>In foal to ${esc(stallion(h.preg.sid)?.name)} (${fmt$(stallion(h.preg.sid)?.fee)}), due ${shortDate(...awToYW(h.preg.due))}</dd>` : h.lotKind === 'M' ? '<dt>Status</dt><dd>Open (not in foal)</dd>' : ''}

  ${l.vet ? `<dt>Vet (X-rays & scope)</dt><dd><b>${h.sound < 0.85 ? 'Clean — no issues' : h.sound < 1.15 ? 'Minor findings, acceptable' : h.sound < 1.4 ? '⚠️ Sesamoiditis / OCD lesion noted' : '⛔ Significant findings — risky'}</b>${h.bleeder && rnd() < 0.5 ? ' · scope shows some blood' : ''}</dd>` : ''}
  ${l.agent ? `<dt>Your agent</dt><dd><b>${agentView(h)}</b></dd>` : ''}</dl>`;

  else if (l.state === 'open' || l.state === 'live') {
    o += `<div class="btnrow">${l.vet ? '' : `<button class="btn ghost sm" data-a="lotVet" data-i="${i}">Vet review ($500)</button>`}${l.agent ? '' : `<button class="btn ghost sm" data-a="lotAgent" data-i="${i}">Agent inspection (${fmt$(agentFee(h))})</button>`}</div>`;
    const blocked = sale.elite && G.rep < 10 && G.cash < 1e6;
    o += blocked ? '<div class="warnbox">You are not credit-approved for this select sale yet.</div>' : `<button class="btn big" data-a="auction" data-i="${i}">Bid on this horse</button>`;
  } else o += `<div class="note">${l.state === 'mine' ? `You bought this horse for ${fmt$(l.price)}.` : l.state === 'sold' ? `Sold to ${esc(l.buyer || 'another buyer')} for ${fmt$(l.price)}.` : `Bought back (RNA) at ${fmt$(l.price)}.`}</div>`;
  openModal(lotTitle(l), o, { push: !re, fn: () => openLot(i, true) });
}
function agentFee(h) { return Math.max(1000, Math.round(h.mkt * 0.01 / 100) * 100); }
function agentView(h) { const r = srng('ag' + h.id); const v = h.ceil + gauss(0, 4.5, r); return v >= 98 ? 'Love this one — graded stakes type.' : v >= 91 ? 'Real stakes potential.' : v >= 84 ? 'Good allowance-type horse.' : v >= 77 ? 'Should win a maiden; nothing special.' : v >= 70 ? 'Claimer at best.' : 'Pass. Doesn\'t look like a runner.'; }
function openAuction(i, re) {

  if (!l.auc) { const v = aiVals(l, sale); l.state = 'live'; l.auc = { cur: roundBid(Math.max(1000, Math.min(v[1] || v[0] * 0.5, v[0] * 0.95))), mine: false, v, R: reserveOf(l), log: ['Bidding opens…'] }; l.auc.log.push(`${fmt$(l.auc.cur)} bid in the back ring.`); }
  const A = l.auc; const nxt = A.cur + bidInc(A.cur);

  <label class="lab">Your share</label><div class="chips">${[[1, 'Buy outright'], [0.5, '50% with partners'], [0.25, '25% with partners']].map(([v, n]) => `<button class="chip sm ${(UI.buyShare || 1) === v ? 'on' : ''}" data-a="buyShare" data-v="${v}">${n}</button>`).join('')}</div>${(UI.buyShare || 1) < 1 ? `<div class="note muted">Partners pay ${Math.round((1 - UI.buyShare) * 100)}% of the price and of every bill, and take the same share of purses and resale.</div>` : ''}
  <label class="lab">Or set a maximum and let your agent bid</label><div class="btnrow"><input id="auc-max" class="inp" type="number" inputmode="numeric" placeholder="max $" value="${Math.round(Math.min(G.cash, l.h.mkt * 1.2))}"><button class="btn" data-a="bidMax" data-i="${i}">Go</button></div>

function aiRespond(l) {
  const A = l.auc; const nxt = A.cur + bidInc(A.cur);
  const willing = A.v.filter(v => v >= nxt); if (willing.length) { A.cur = nxt; A.mine = false; A.log.push(`${fmt$(A.cur)} — ${A.cur > 250000 && Math.random() < 0.6 ? 'agent for ' + buyerName(saleThisWeek() || {}, rnd) : pick(['bid on the phone', 'agent in the pavilion', 'back-walking ring', 'the pinhooker in row 4', 'an international bidder'])}`); return true; }

}
function hammer(i) {
  const l = G.saleLots[i]; const A = l.auc;
  if (A.mine) { if (A.cur >= A.R) { buyLot(l, A.cur, UI.buyShare || 1); toast(`Sold to ${G.stable}!`); } else { l.state = 'rna'; l.price = A.cur; A.log.push('Reserve not met — horse bought back.'); toast('Reserve not met (RNA)'); } }
  else { // AI wins: finish among themselves
    const v = A.v; const top = v[0]; const price = Math.max(A.cur, roundBid(Math.min(top, (v[1] || 0) + bidInc(v[1] || 0)))); if (price < A.R) { l.state = 'rna'; l.price = price; } else { l.state = 'sold'; l.price = price; }
  }
  delete l.auc; scheduleSave(); openLot(i, true);
}

function studTraits(s) { return [s.dist <= 7 ? 'speed' : s.dist >= 9.5 ? 'stamina' : 'middle distance', s.turf > 0.4 ? 'turf' : s.turf < -0.3 ? 'dirt' : 'versatile', s.mat > 0.4 ? 'precocious' : s.mat < -0.3 ? 'late-maturing' : ''].filter(Boolean).join(' · '); }

  openModal(esc(s.name), o, { push: !re, fn: () => openStud(sid, true) });
}

// ---------- OFFICE ----------

// ---------- WEEK REPORT ----------
function repHidden(rep, i) { return !G.showRes && rep.races[i].mine.length > 0 && !(rep.seen || []).includes(i); }
function openReport(rep) {
  rep = rep || G.lastRep; if (!rep) return;
  let o = '';
  const hid = rep.races.map((_, i) => repHidden(rep, i)); const nHid = hid.filter(Boolean).length;
  if (nHid) o += `<div class="spoil-n">${nHid > 1 ? `${nHid} races ran this week — results hidden until you watch.` : 'Results hidden until you watch.'}${nHid > 1 ? ' <button class="btn xs ghost" data-a="reveal" data-i="all">Show all results</button>' : ''}</div>`;
  if (rep.races.length) o += rep.races.map((res, i) => hid[i] ? `<div class="resc spoil"><div class="resc-h"><span class="fpos">?</span><div><b>${res.mine.map(m => esc(m.name)).join(' & ')}</b><div class="hs">${esc(res.label)} · ${TRACKS[res.trk].n} · ${distStr(res.dist)} ${SURF_N[res.surf].toLowerCase()} · ${res.runners.length} runners</div></div></div>
  <div class="btnrow"><button class="btn sm" data-a="watch" data-i="${i}">▶ Watch the race</button><button class="btn sm ghost" data-a="reveal" data-i="${i}">Show result</button></div></div>` : res.mine.map(m => `<div class="resc ${m.fin === 1 ? 'win' : m.fin <= 3 ? 'itm' : ''}"><div class="resc-h"><span class="fpos">${ordinal(m.fin)}</span><div><b>${esc(m.name)}</b><div class="hs">${esc(res.label)} · ${TRACKS[res.trk].n} · ${distStr(res.dist)} ${SURF_N[res.surf].toLowerCase()}</div></div></div>
  <div class="hs">${m.fin === 1 ? `Won by ${lenStr(res.runners[1]?.btn || 0)}` : `Beaten ${lenStr(m.btn)}`} · fig <b>${m.fig}</b> · ${oddsStr(m.odds)} · ${esc(m.comment)}${m.share ? ` · <b class="good">${fmt$(m.share)}</b>` : ''}${m.bonus ? ` + bonuses ${fmt$(m.bonus)}` : ''}${m.fundNote ? ` · <i>${esc(m.fundNote)}</i>` : ''}${m.bet ? (m.betRet ? ` · bet paid ${fmt$(m.betRet)}` : ` · lost ${fmt$(m.bet)} bet`) : ''}</div>
  <button class="btn sm" data-a="watch" data-i="${i}">▶ Watch the race</button></div>`).join('') || `<div class="resc"><b>Claim race:</b> ${esc(res.label)} at ${TRACKS[res.trk].n} <button class="btn sm" data-a="watch" data-i="${i}">▶ Watch</button></div>`).join('');
  const hideNames = rep.races.filter((_, i) => hid[i]).flatMap(res => res.mine.map(m => m.name)).filter(Boolean);
  const spoils = n => hideNames.some(nm => n.t.includes(nm));
  const shown = rep.news.filter(n => !spoils(n)); const held = rep.news.length - shown.length;
  o += shown.length ? '<h3 class="sub">This week</h3>' + shown.map(n => `<div class="news ${n.type}">${esc(n.t)}</div>`).join('') : held || rep.races.length ? '' : '<p class="pad muted">A quiet week at the barn.</p>';
  if (held) o += `<p class="pad muted">${held} news item${held > 1 ? 's' : ''} about your runners will show once you see the result${nHid > 1 ? 's' : ''}.</p>`;
  o += '<button class="btn big" data-a="close">Continue</button>';
  UI.rep = rep; UI.holding = nHid > 0; renderTop();
  openModal(`Week of ${shortDate(rep.yr, rep.wk)}, ${rep.yr}`, o, { push: false, fn: () => openReport(UI.rep) });
}
function watchRace(i) {
  const res = UI.rep.races[i];
  openModal('🏁 ' + TRACKS[res.trk].n, '<div class="racehost"></div>');
  const host = $('.racehost'); const rep = UI.rep;
  UI.anim = playRace(host, res, () => { rep.seen = [...new Set([...(rep.seen || []), i])]; scheduleSave(); const r = host.querySelector('.race-res'); if (r) r.insertAdjacentHTML('beforeend', '<button class="btn big" data-a="back">Back to the week</button>'); });
}

document.addEventListener('click', e => {

});

// ---------- SAVE ----------
let saveT = null;
function scheduleSave() { clearTimeout(saveT); saveT = setTimeout(saveNow, 700); renderTop(); }
const SNAP_KEY = 'turf_tycoon_snaps';
function getSnaps() { try { return JSON.parse(localStorage.getItem(SNAP_KEY) || '[]'); } catch (e) { return []; } }
function pushSnap(label) { try { const L = getSnaps(); L.push({ label: label || `${shortDate(G.yr, G.wk)}, ${G.yr}`, aw: AW(), n: G.horses.length, cash: G.cash, data: serialize() }); while (L.length > 6) L.shift(); localStorage.setItem(SNAP_KEY, JSON.stringify(L)); } catch (e) { try { const L = getSnaps(); L.splice(0, 2); localStorage.setItem(SNAP_KEY, JSON.stringify(L)); } catch (e2) { } } }
function saveNow() {
  if (!G) return; const s = serialize();
  try { localStorage.setItem(SAVE_KEY, s); } catch (e) { }
  if (AW() % 13 === 0 && G.lastSnap !== AW()) { G.lastSnap = AW(); pushSnap(); }
  cloudSave(s);
}
async function cloudInit() {
  try {
    if (!window.claude || !window.claude.use) return;
    const user = await window.claude.use('user'); const db = await window.claude.use('db'); if (!user || !db) return;
    const uid = await user.id(); if (!uid) return;
    cloud.db = db; cloud.uid = uid;
    const meta = await db.doc('data/users/' + uid + '/meta').get();
    if (meta.exists) {
      const m = meta.data(); const localAt = G ? (G.savedAt || 0) : 0;
      if (m.savedAt > localAt + 1000) {
        let s = ''; for (let i = 0; i < m.n; i++) { const c = await db.doc('data/users/' + uid + '/save' + i).get(); if (!c.exists) throw new Error('chunk'); s += c.data().d; }
        loadFromString(s); try { localStorage.setItem(SAVE_KEY, s); } catch (e) { } render(); toast('Loaded your saved stable');
      }
    }
    cloud.status = 'cloud'; const ss = $('#savestat'); if (ss) ss.textContent = 'saved to your account';
    if (G) saveNow();
  } catch (e) { console.warn('cloud', e); }
}
async function cloudSave(s) {
  if (!cloud.db) return; if (cloud.busy) { cloud.pending = s; return; } cloud.busy = true;
  try {
    const CH = 180000; const n = Math.ceil(s.length / CH);
    for (let i = 0; i < n; i++) await cloud.db.doc('data/users/' + cloud.uid + '/save' + i).set({ d: s.slice(i * CH, (i + 1) * CH) });
    await cloud.db.doc('data/users/' + cloud.uid + '/meta').set({ n, savedAt: JSON.parse(s).savedAt || Date.now(), v: 1 });
  } catch (e) { console.warn('cloud save', e); }
  cloud.busy = false; if (cloud.pending) { const p = cloud.pending; cloud.pending = false; cloudSave(p); }
}
async function cloudDelete() { if (!cloud.db) return; try { await cloud.db.doc('data/users/' + cloud.uid + '/meta').delete(); } catch (e) { } }

// ---------- BOOT ----------
function boot() {
  try { const s = localStorage.getItem(SAVE_KEY); if (s) loadFromString(s); } catch (e) { G = null; }
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  $('.x').onclick = closeModal; $('#back').onclick = backModal;
  render();
  setTimeout(cloudInit, 50);
}

// trail / qualifier tags: Derby & Oaks points, Triple Crown, Breeders' Cup Win & You're In
function raceTags(r) {
  const t = r.tags || '', out = [];
  const p = t.match(/p(\d+)/), q = t.match(/o(\d+)/);
  if (p) out.push(['kd', `🌹 Derby trail · ${p[1]} pts`]);
  if (q) out.push(['ko', `🌸 Oaks trail · ${q[1]} pts`]);

  if (t.includes('KO')) out.push(['ko', '🌸 Kentucky Oaks · top 14 on points']);
  if (t.includes('TC') && !t.includes('KD')) out.push(['tc', 'Triple Crown']);
  if (r.g && typeof WAYI !== 'undefined' && WAYI[r.name]) out.push(['bc', `🏆 Win & You're In · BC ${WAYI[r.name]}`]);

function applyRaceFilters(list, f) {

  if (G.lastRep && (G.lastRep.races.length || G.lastRep.news.length)) o += `<button class="btn ghost wide sm" data-a="report">Last week's results & news</button>`;
  const groups = [['race', 'Racing', h => h.status === 'race'], ['farm', 'Layups', h => h.status === 'farm'], ['young', 'Young stock', h => h.status === 'young'], ['mare', 'Broodmares', h => h.status === 'mare'], ['stud', 'Stallions', h => h.status === 'stud']];
  const cnt = Object.fromEntries(groups.map(([k, , f]) => [k, H.filter(f).length]));
  o += chipRow([['all', 'All', H.length], ...groups.filter(([k]) => cnt[k]).map(([k, n]) => [k, n, cnt[k]])], UI.stf.grp, 'stfset', 'grp');
  o += `<div class="fbar">${fpill('stsort', 'Sort', [['status', 'Needs attention first'], ['name', 'Name'], ['earn', 'Earnings'], ['value', 'Value'], ['age', 'Age']], UI.stf.sort, 'stf')}</div>`;
  if (H.length > 6) o += searchBox('stable', 'Search your horses (name, sire, dam)');
  const prio = (h) => (h.needTrainer || (!h.name && ageOf(h) >= 2) ? 0 : h.inj ? 3 : G.entries.some(e => e.hid === h.id) ? 2 : h.status === 'race' && h.fit >= 80 ? 1 : 4);
  const srt = { status: (a, b) => prio(a) - prio(b), name: (a, b) => dispName(a).localeCompare(dispName(b)), earn: (a, b) => b.earn - a.earn, value: (a, b) => marketValue(b) - marketValue(a), age: (a, b) => a.foal - b.foal }[UI.stf.sort];
  for (const [k, n, f] of groups) {
    if (UI.stf.grp !== 'all' && UI.stf.grp !== k) continue;
    const hs = H.filter(f).filter(h => qMatch('stable', dispName(h) + ' ' + h.sireName + ' ' + h.damName)).sort(srt); if (!hs.length) continue;
    o += `<h2 class="sec">${n} <span>${hs.length}</span></h2>` + hs.map(hcard).join('');
  }
  return o;
}

// ---------- HORSE ACTIONS (grouped) ----------
function horseActions(h) {
  const a = ageOf(h); const G1 = [], G2 = [], G3 = [], G4 = [];
  const offer = G.offers.find(x => x.hid === h.id);
  let o = '';
  if (offer) o += `<div class="banner">Offer of <b>${fmt$(offer.amt)}</b> from ${offer.from}${offer.stud ? ' to stand at stud' : ''}. ${A('offerAcc', 'Accept', 'sm')} ${A('offerDec', 'Decline', 'sm ghost')}</div>`;
  if (!h.name && a >= 1) G1.push(A('name', '✏️ Name this horse', 'hi'));
  if (h.status === 'race') {
    if (h.needTrainer) G1.push(A('trainerPick', '👤 Choose a trainer', 'hi'));
    G1.push(A('planner', '🏁 Plan races — trainer\'s picks', 'hi'));
    G1.push(`<div class="toggle-row"><label><input type="checkbox" data-a="auto" data-id="${h.id}" ${h.auto.on ? 'checked' : ''}> Let the trainer pick races</label>${h.auto.on ? `<label><input type="checkbox" data-a="autoClm" data-id="${h.id}" ${h.auto.clm ? 'checked' : ''}> Allow claiming races</label><label><input type="checkbox" data-a="autoStk" data-id="${h.id}" ${h.auto.stk ? 'checked' : ''}> Allow stakes (pays entry fees)</label>` : ''}</div>`);
    G1.push(A('trainerPick', '👤 Change trainer'));
    G2.push(A('turnout', '🌾 Turn out to rest') + A('blinkers', h.blinkers ? 'Remove blinkers' : 'Add blinkers'));
    if (h.sex === 'C' && !h.gelded) G2.push(A('geld', '✂️ Geld ($800)'));
  }
  if (h.status === 'farm' && !(h.inj && h.inj.sev === 3)) G1.push(A('totrain', '🏇 Back into training', 'hi'));
  if (h.status === 'young') { if (a >= 2) G1.push(A('trainerPick', '🏇 Send to a trainer', 'hi')); else if (a === 1 && G.wk >= 36 && !h.pre) G1.push(A('pretrain', '🐴 Send to pre-training ($55/day)', 'hi')); }
  if (a === 3 && h.status === 'race' && !h.tcNom && G.wk <= 13 && h.sex === 'C') G1.push(A('tcnom', `👑 Triple Crown nomination (${G.wk <= 4 ? '$600 early' : '$6,000 late'})`));
  if (!h.bcNom && h.status !== 'mare' && h.status !== 'stud' && a <= 4) G1.push(A('bcnom', `🏆 Breeders' Cup nomination (${a === 0 ? '$400' : '$20,000 late'})`));
  if (!h.mstnKnown && h.mstn) G2.push(A('mstn', '🧬 Speed-gene test ($1,000)'));
  if (h.status === 'mare') { G1.push(A('bookPick', '🧬 Book to a stallion', inSeason() && !h.preg ? 'hi' : '')); G2.push(A('moveFarm', '🚚 Move to another state')); }
  if (h.status === 'stud') { G1.push(A('studFee', '💵 Set stud fee')); G3.push(A('sellStud', '🤝 Sell stallion')); }
  if (h.status !== 'stud') G3.push(h.ins ? A('insToggle', h.ins.auto ? `🛡️ Insured ${fmtK(h.ins.val)} — cancel auto-renew` : '🛡️ Turn auto-renew back on') : A('insBuy', `🛡️ Insure: ${fmt$(Math.round(insValue(h) * 0.035))}/yr for ${fmtK(insValue(h))}`));
  if (h.status !== 'stud' && OWN(h) > 0.25 + 1e-9) G3.push(A('partner', `🤝 Sell a share to partners (you own ${Math.round(OWN(h) * 100)}%)`));
  if (h.status === 'stud' && canShuttle(h)) G3.push(A('shuttle', h.shuttle ? '✈️ Cancel Australia shuttle' : '✈️ Shuttle to Australia (Aug–Dec)'));
  if (h.status !== 'stud') G3.push(A('consignPick', '🔨 Consign to a sale') + A('sellTrader', `💸 Sell to a trader now (${fmt$(traderPrice(h))})`));
  if (h.status === 'race' || h.status === 'farm') G4.push(A('retire', '🏡 Retire'));
  if (h.status === 'mare') G4.push(A('pension', '🏡 Pension'));
  const grp = (t, L) => L.length ? `<h3 class="sub">${t}</h3><div class="acts">${L.join('')}</div>` : '';
  return o + grp(h.status === 'mare' || h.status === 'stud' ? 'Breeding' : 'Racing', G1) + grp('Care & equipment', G2) + grp('Business', G3) + grp('Retirement', G4);
}

function advBtn(act) { return `<button class="btn xs" ${Object.entries(act).filter(([k]) => k !== 'label').map(([k, v]) => k === 'a' ? `data-a="${v}"` : `data-${k}="${esc(v)}"`).join(' ')}>${esc(act.label)}</button>`; }
function openAdvice() {

  }

}
function advItem(x, hot) {
  // racing items for a horse: expand with the trainer's top 3 spots
  let extra = '';
  if (x.icon === '🏁' && x.act && x.act.id) { const h = horse(x.act.id); if (h) { const { est, k } = trainerEst(h); const seen = new Set(); const sp = bestSpots(h).filter(s => !seen.has(s.r.id) && seen.add(s.r.id)).slice(0, 3); extra = `<div class="adv-sp">${sp.map(s => `<div data-a="race" data-rid="${s.r.id}">${raceNum(s.r)}<span><b>${esc(raceShort(s.r))}</b> ${shortDate(s.r.yr, s.r.wk)} · ${TRACKS[s.r.trk].n} · ${fmtK(s.r.purse)}<br><i>${spotWhy(h, s, est, k).slice(0, 3).map(w => w[1]).join(' · ')}</i></span></div>`).join('')}</div>`; } }

}

function tutCard() {
  const T = G.tut; if (!T || T.step >= TUT.length) return '';
  while (TUT[T.step].done && TUT[T.step].done()) { T.step++; T.wk0 = T.wk0 || AW(); if (T.step === 4) T.wk0 = AW(); }
  const s = TUT[T.step]; const n = TUT.length - 2;
  const prog = T.step === 0 ? '' : T.step > n ? 'Done' : `Step ${T.step} of ${n}`;
  if (UI.tab !== 'stable' && !s.btn) return `<div class="tut mini"><div class="tut-h"><b>${esc(s.t)}</b><span>${prog}</span></div><div class="tut-d">${s.d.split('. ')[0].replace(/\.$/, '')}.</div><div class="tut-b"><button class="btn xs" data-a="tutGo">Show me</button><button class="btn xs ghost" data-a="tutSkip">Skip guide</button></div></div>`;
  return `<div class="tut"><div class="tut-h"><b>${esc(s.t)}</b>${prog ? `<span>${prog}</span>` : ''}</div><div class="tut-d">${s.d}</div><div class="tut-b">${s.btn ? `<button class="btn sm" data-a="tutNext">${s.btn}</button>` : `<button class="btn sm" data-a="tutGo">Show me</button>`}${T.step < TUT.length - 1 ? `<button class="btn sm ghost" data-a="tutSkip">Skip guide</button>` : ''}</div>${T.step > 0 && T.step <= n ? `<div class="tut-p">${Array.from({ length: n }, (_, i) => `<i class="${i + 1 < T.step ? 'on' : i + 1 === T.step ? 'cur' : ''}"></i>`).join('')}</div>` : ''}</div>`;
}
function tutShow() {
  const st = G.tut.step; const rh = G.horses.find(h => h.status === 'race');
  if (st === 1) { UI.tab = 'sales'; UI.sf.sub = 'mkt'; render(); window.scrollTo(0, 0); }
  else if (st === 2 && rh) openTrainerPicker(rh.id, 'hire');
  else if (st === 3 && rh) openPlanner(rh.id);
  else if (st === 4) { const b = $('#advbar .adv'); if (b) { b.classList.add('pulse'); setTimeout(() => b.classList.remove('pulse'), 2400); } toast('Tap “Advance week” at the bottom'); }
  else if (st === 5) { G.tut.adv = 1; openAdvice(); }
  else { UI.tab = 'stable'; render(); }
}

boot();
try { if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => { r.update().catch(() => {}); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') r.update().catch(() => {}); }); }).catch(() => {}); if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { }
</script>
