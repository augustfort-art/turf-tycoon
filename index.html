<style>:root{--g:#0e3b2c;--g2:#16513d;--g3:#1f6b50;--paper:#f6f0e2;--card:#fffdf7;--ink:#1f1b14;--brass:#b98a2f;--brass2:#e2b858;--muted:#7a705c;--line:#e3d8bf;--red:#a3262e;--good:#2b6e3f;--blue:#2a5a8a;--warn:#a5671a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Barlow',system-ui,sans-serif;font-size:15px;line-height:1.35}
button{font:inherit;color:inherit}
#app{max-width:620px;margin:0 auto;min-height:100vh;padding-bottom:140px}
#top{position:sticky;top:0;z-index:20;background:var(--g);color:#f6ecd2;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));box-shadow:0 2px 0 var(--brass)}
.tl{display:flex;gap:10px;align-items:center}.sn{font-family:'DM Serif Display',serif;font-size:19px;letter-spacing:.2px}.sd{font-size:12px;opacity:.8}
.tr{text-align:right}.cash{font-family:'Barlow Condensed';font-weight:700;font-size:21px;color:var(--brass2)}.cash.neg{color:#ff8b8b}.rep{font-size:11px;opacity:.75;text-transform:uppercase;letter-spacing:.6px}
canvas.silk{border-radius:50%;box-shadow:0 0 0 1.5px rgba(255,255,255,.6)}
#view{padding:12px}
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;background:#fffaf0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;max-width:124px;background:none;border:0;padding:7px 0 8px;font-size:11.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;position:relative}
.tab .ti{font-size:19px;filter:grayscale(.6);opacity:.75}.tab.on{color:var(--g)}.tab.on .ti{filter:none;opacity:1}
.tab em{position:absolute;top:3px;right:22%;background:var(--red);color:#fff;font-style:normal;font-size:10px;border-radius:9px;min-width:16px;padding:0 4px}
#advbar{position:fixed;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom));z-index:29;display:flex;justify-content:center;padding:0 12px 8px;pointer-events:none}
.adv{pointer-events:auto;width:100%;max-width:596px;border:0;border-radius:14px;background:linear-gradient(180deg,var(--g3),var(--g));color:#fff;padding:9px 14px;display:flex;flex-direction:column;align-items:center;box-shadow:0 6px 18px rgba(14,59,44,.35),inset 0 0 0 1.5px var(--brass)}
.adv span{font-family:'DM Serif Display';font-size:18px}.adv small{font-size:11.5px;opacity:.85}
.adv:active{transform:translateY(1px)}
h2.sec{font-family:'DM Serif Display';font-weight:400;font-size:20px;margin:18px 2px 8px;color:var(--g);display:flex;align-items:center;gap:8px}h2.sec span{font-family:'Barlow';font-size:12px;background:var(--g);color:#fff;border-radius:10px;padding:1px 8px}
h3.sub{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:16px 2px 6px}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.hcard:active{background:#f8f1e0}.hn{font-family:'DM Serif Display';font-size:17px}.hs{font-size:12.5px;color:var(--muted)}.hst{font-size:13px;margin-top:3px}
.hc-r{text-align:right;min-width:78px;display:flex;flex-direction:column;align-items:flex-end;gap:1px}.rec{font-family:'Barlow Condensed';font-size:15px;font-weight:600}.earn{font-family:'Barlow Condensed';font-weight:700;font-size:17px;color:var(--g2)}
.fit{width:64px;height:5px;border-radius:3px;background:#e8dfc9;overflow:hidden;margin-top:4px}.fit i{display:block;height:100%}
.bt{font-family:'Barlow';font-size:10.5px;font-weight:700;background:var(--brass);color:#fff;border-radius:4px;padding:1px 5px;vertical-align:middle}
.fig{font-family:'Barlow Condensed';color:var(--g)}
.good{color:var(--good)}.bad{color:var(--red)}.warn{color:var(--warn)}.info{color:var(--blue)}.muted{color:var(--muted)}.ok{color:var(--good);font-weight:600}.no{color:var(--red)}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}.btn:disabled{opacity:.4}
.btn.ghost{background:transparent;color:var(--g);box-shadow:inset 0 0 0 1.5px var(--g)}.btn.sm{padding:6px 11px;font-size:13.5px}.btn.xs{padding:4px 8px;font-size:12px}
.btn.big{width:100%;padding:13px;font-size:16px;margin-top:12px;background:linear-gradient(180deg,var(--g3),var(--g));box-shadow:inset 0 0 0 1.5px var(--brass)}
.btn.wide{width:100%;margin:4px 0 10px}.btn.hi{background:var(--brass);color:#fff}.btn.danger{color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}.btn.on{background:var(--brass)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.btnrow .inp{flex:1}
.acts{display:flex;flex-direction:column;gap:7px;padding:4px 0}.acts .btn{text-align:left}
.toggle-row{background:#f3ead4;border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.seg{display:flex;background:#ebe1c9;border-radius:10px;padding:3px;margin:4px 0 10px}.seg button{flex:1;border:0;background:none;padding:7px 4px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}.seg button.on{background:var(--card);color:var(--g);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer}.chip.on{background:var(--g);color:#fff;border-color:var(--g)}.chip.sm{padding:4px 10px;font-size:12px}
.rrow{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer}
.rr-t{font-weight:600;font-size:14px}.rr-s{font-size:12px;color:var(--muted)}.rr-m{font-size:12px;color:var(--good);font-weight:600}.rr-e{font-size:12px}.rr-r{text-align:right;display:flex;flex-direction:column;min-width:64px}.rr-r b{font-family:'Barlow Condensed';font-size:16px}.rr-r small{font-size:11px;color:var(--muted)}
.gr{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;background:#776;color:#fff}.gr.g1{background:var(--brass)}.gr.g2{background:#8a8f99}.gr.g3{background:#9a6b45}
.note{background:#efe6cf;border-radius:10px;padding:8px 11px;font-size:13px;margin:6px 0 10px}.note.muted{background:transparent;padding:2px 2px 8px}
.warnbox{background:#fbe9d2;border:1px solid #efc58e;border-radius:9px;padding:8px 10px;font-size:13px;margin:6px 0}
.banner{background:#fff4d6;border:1px solid var(--brass2);border-radius:10px;padding:9px 11px;margin-bottom:10px;font-size:14px;cursor:pointer}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}.empty .big{font-size:48px}.empty a{color:var(--g);font-weight:600;text-decoration:underline;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.stats div{text-align:center;background:#f5edda;border-radius:8px;padding:6px 2px}.stats b{display:block;font-family:'Barlow Condensed';font-size:18px}.stats span{font-size:10.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.4px}
.repbar{height:7px;background:#e8dfc9;border-radius:4px;overflow:hidden;margin:6px 0}.repbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),var(--brass2))}
.fin{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px}.fc h4{margin:0 0 5px;font-size:13.5px}.fc div{display:flex;justify-content:space-between;gap:4px;border-bottom:1px dotted var(--line);padding:2px 0}
.net{text-align:right;font-weight:700;margin:6px 2px;font-family:'Barlow Condensed';font-size:18px}
.erow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line)}
.news{font-size:13px;padding:6px 2px;border-bottom:1px solid var(--line)}.news span{color:var(--muted);font-size:11.5px;margin-right:6px}.news.good{color:#1f4f30}.news.bad{color:#7e1f25}
/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,25,18,.55);display:flex;align-items:flex-end;justify-content:center}#modal.hidden{display:none}
.sheet{background:var(--paper);width:100%;max-width:620px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -6px 30px rgba(0,0,0,.25)}
.sheet-h{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border-bottom:2px solid var(--brass);background:var(--g);color:#f6ecd2;border-radius:18px 18px 0 0}
.sheet-t{flex:1;font-family:'DM Serif Display';font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-h button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;width:32px;height:30px;font-size:15px}
.sheet-b{overflow-y:auto;padding:12px 14px calc(24px + env(safe-area-inset-bottom))}
.pad{padding:4px 2px}.lab{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:12px 0 5px;font-weight:600}
.inp{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 11px;font:inherit;background:#fff}.inp.code{height:140px;font-family:monospace;font-size:11px;word-break:break-all}
.radio{display:block;padding:7px 9px;border-radius:9px;background:var(--card);border:1px solid var(--line);margin-bottom:5px;font-size:14px}.radio.dis{opacity:.5}
.fees{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:12px;font-size:13.5px}.fees div{display:flex;justify-content:space-between;padding:2px 0}.fees .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:5px;font-weight:700}
.hhead{margin-bottom:8px}.ped{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14px}.ped div{padding:2px 0}.ped span{display:inline-block;width:40px;font-size:11px;text-transform:uppercase;color:var(--muted)}.ped small{color:var(--muted);font-size:12px;display:block;margin-left:40px}
.take{background:#fff8e6;border-left:3px solid var(--brass);border-radius:6px;padding:8px 11px;margin:6px 0 10px;font-size:14px}.take p{margin:3px 0;font-style:italic}.tk-h{font-weight:700;font-size:12.5px;color:var(--warn)}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13.5px;margin:6px 0}dl.kv dt{color:var(--muted);font-size:12.5px}dl.kv dd{margin:0}
table.dtab{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card);border-radius:8px;overflow:hidden}.dtab th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--muted);padding:5px;border-bottom:1px solid var(--line)}.dtab td{padding:5px;border-bottom:1px solid #f0e8d4;vertical-align:top}.dtab tr.w td{background:#f3f8ef}.dtab tr.me td{background:#fff4d6}.cm{font-size:11px;color:var(--muted)}.bullet{color:var(--red)}
.pn{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:4px;font-size:11.5px;font-weight:700;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);margin-right:3px}.pn.me{box-shadow:0 0 0 2px var(--brass2)}.pn.more{background:none;box-shadow:none}
.rinfo{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13.5px;line-height:1.5}
.salehead{background:var(--g);color:#f6ecd2;border-radius:12px;padding:12px;margin-bottom:10px}.sh-k{font-size:11px;text-transform:uppercase;letter-spacing:.8px;opacity:.75}.sh-n{font-family:'DM Serif Display';font-size:20px}
.auc{background:var(--g);color:#fff;border-radius:14px;padding:16px;text-align:center}.auc-p{font-family:'Barlow Condensed';font-size:42px;font-weight:700;color:var(--brass2)}.auc-w{font-size:14px;margin-bottom:6px}.auc-w .good{color:#9be29b}.auc-log{font-size:12.5px;opacity:.85;text-align:left;background:rgba(0,0,0,.18);border-radius:8px;padding:6px 9px}
.resc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}.resc.win{border-color:var(--brass);background:#fff8e3}.resc.itm{border-color:#bcd2b5}
.resc-h{display:flex;gap:10px;align-items:center;margin-bottom:4px}.fpos{font-family:'DM Serif Display';font-size:24px;color:var(--g);min-width:44px}.resc .btn{margin-top:7px}
.racehost{min-height:300px}.race-head{margin-bottom:6px}.rh-title{font-weight:700;font-size:14px}.rh-sub{font-size:12px;color:var(--muted)}
.race-cv{display:block;margin:0 auto;border-radius:12px;background:#3a7a49}.race-order{display:flex;gap:3px;justify-content:center;margin:8px 0 4px;min-height:22px}
.race-call{background:#14261d;color:#f1ead6;border-radius:10px;padding:9px 11px;font-size:14px;min-height:62px}.race-call b{color:var(--brass2)}.me-call{display:block;color:#9be29b;font-size:13px;margin-top:3px}
.race-ctl{display:flex;gap:6px;justify-content:center;margin:8px 0}.race-ctl .btn{min-width:48px}
.official{text-align:center;font-family:'Barlow Condensed';font-weight:700;letter-spacing:3px;background:#c22;color:#fff;border-radius:6px;padding:3px;margin:10px 0 6px}
table.rtab{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card)}.rtab th{font-size:10.5px;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px}.rtab td{padding:4px;border-bottom:1px solid #eee3cc;vertical-align:top}.rtab tr.me td{background:#fff4d6;font-weight:600}.rtab .nm{max-width:150px}
#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-20px);background:#14261d;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}
/* new game */
body.newgame #app{padding-bottom:30px}
.hero{background:radial-gradient(120% 90% at 50% 0%,var(--g3),var(--g));color:#f6ecd2;border-radius:16px;padding:28px 18px 22px;text-align:center;margin-bottom:12px;box-shadow:inset 0 0 0 2px var(--brass)}
.hero h1{font-family:'DM Serif Display';font-weight:400;font-size:40px;margin:2px 0 6px;color:var(--brass2)}.hero p{margin:0;opacity:.9}.hero-k{letter-spacing:4px;font-size:11px;opacity:.7}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.opt{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;gap:2px;text-align:center;cursor:pointer}.opt small{font-size:11px;color:var(--muted)}.opt.on{border-color:var(--g);background:#eaf2ec}
.silkpick{display:flex;gap:14px;align-items:flex-start}.silkprev{padding-top:6px}.sw-l{font-size:11px;color:var(--muted);margin:4px 0 3px}.sw{display:flex;flex-wrap:wrap;gap:5px}.swc{width:24px;height:24px;border-radius:50%;border:1px solid rgba(0,0,0,.2);cursor:pointer}.swc.on{box-shadow:0 0 0 2.5px var(--brass)}
.help p{font-size:14px;margin:8px 0}
input[type=checkbox],input[type=radio]{accent-color:var(--g)}
.cutline{text-align:center;color:var(--red);font-size:11px;letter-spacing:2px;background:#fbeaea}
.bt.own{background:var(--blue)}
.bk{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
</style>
</head>

}
function playRace(host, res, onDone) {

  <canvas class="race-cv"></canvas><div class="race-order"></div><div class="race-call">The horses are approaching the starting gate…</div>
  <div class="race-ctl"><button class="btn sm" data-sp="2">2×</button><button class="btn sm on" data-sp="4">4×</button><button class="btn sm" data-sp="8">8×</button><button class="btn sm ghost" data-sp="skip">Skip ▸▸</button></div><div class="race-res"></div>`;
  const cv = host.querySelector('canvas'); const ctx = cv.getContext('2d');
  const W = Math.min(host.clientWidth || 340, 520), dpr = window.devicePixelRatio || 1;
  const R = W * 0.2, a = W * 0.23, H = 2 * (R + 24) + 44;
  cv.style.width = W + 'px'; cv.style.height = H + 'px'; cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
  const cx = W / 2, cy = H / 2;
  const turf = res.surf === 'T'; const Rbase = turf ? R - 21 : R; const band = 24; const laneW = turf ? 2.1 : 2.7;
  const Pp = 4 * a + 2 * Math.PI * Rbase; const fpx = Pp / (turf ? 7.5 : 8);

  host.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => { if (b.dataset.sp === 'skip') { t = maxT + 2; } else { speed = +b.dataset.sp; host.querySelectorAll('[data-sp]').forEach(x => x.classList.toggle('on', x === b)); } });

function horseStatus(h) {

  const con = G.consign.find(c => c.hid === h.id); if (con) return `<span class="info">🔨 Consigned to ${SALES.find(s => s.id === con.sale).n}</span>`;

    if (h.starts && days < 21) return `<span>Freshening · ran ${days} days ago</span>`;
    return `<span class="${h.auto.on ? 'info' : 'warn'}">${h.auto.on ? 'Trainer picking a spot' : 'Ready to run — find a race'}</span>`;
  }
  if (h.status === 'farm') return '<span>Turned out at the farm</span>';

  if (mares.length) o += '<h3 class="sub">Book a mare</h3>' + mares.map(m => { const [ok, why] = canBook(m, s); const useShare = sh && sh.usedYr !== G.yr; return `<div class="erow"><div><b>${esc(m.name)}</b><div class="hs">${ageOf(m)}yo · by ${esc(m.sireName)} · nick <b>${nickGrade(s, m)}</b>${ok ? '' : ' · ' + esc(why)}</div></div>${ok ? (useShare ? `<button class="btn sm" data-a="doBook" data-id="${m.id}" data-sid="${sid}" data-how="share">Use share</button>` : `<div class="bk"><button class="btn sm" data-a="doBook" data-id="${m.id}" data-sid="${sid}">Book</button>${s.pid ? '' : `<button class="btn xs ghost" data-a="doBook" data-id="${m.id}" data-sid="${sid}" data-how="ng">No-guarantee ${fmtK(s.fee * 0.7)} now</button>`}</div>`) : ''}</div>`; }).join('') + (s.pid ? '' : '<div class="note muted">"Book" pays the full fee only if a live foal is born. A no-guarantee season costs 30% less but is paid now — no refund if she doesn\'t get in foal.</div>');
  openModal(esc(s.name), o, { push: !re, fn: () => openStud(sid, true) });
}

// ---------- OFFICE ----------
function vOffice() {
  const f = G.fin[G.yr] || { inc: {}, exp: {} }; const inc = Object.values(f.inc).reduce((a, b) => a + b, 0), exp = Object.values(f.exp).reduce((a, b) => a + b, 0);
  const val = G.horses.reduce((a, h) => a + marketValue(h), 0);
  let o = `<div class="card"><div class="stats"><div><b>${fmtK(G.cash)}</b><span>cash</span></div><div><b>${fmtK(val)}</b><span>bloodstock</span></div><div><b>${G.horses.length}</b><span>horses</span></div><div><b>${G.trophies.length}</b><span>trophies</span></div></div>
  <div class="repbar"><i style="width:${G.rep}%"></i></div><div class="hs">Reputation: <b>${repTitle(G.rep)}</b> (${G.rep.toFixed(1)}). Leading trainers want 15+, Hall of Famers 35+ — or a horse worth their time.</div></div>`;
  if (G.offers.length) o += '<h2 class="sec">Offers</h2>' + G.offers.map(of => { const h = horse(of.hid); return `<div class="erow"><div><b>${esc(h.name)}</b><div class="hs">${fmt$(of.amt)} from ${of.from}${of.stud ? ' (to stand at stud)' : ''} · est. value ${fmt$(marketValue(h))}</div></div><div><button class="btn sm" data-a="offerAcc" data-id="${h.id}">Accept</button> <button class="btn sm ghost" data-a="offerDec" data-id="${h.id}">No</button></div></div>`; }).join('');
  o += `<h2 class="sec">${G.yr} finances</h2><div class="fin"><div class="fc"><h4>Income ${fmtK(inc)}</h4>${Object.entries(f.inc).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div><span>${k}</span><b>${fmtK(v)}</b></div>`).join('') || '<div class="muted">—</div>'}</div><div class="fc"><h4>Expenses ${fmtK(exp)}</h4>${Object.entries(f.exp).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div><span>${k}</span><b>${fmtK(v)}</b></div>`).join('') || '<div class="muted">—</div>'}</div></div><div class="net ${inc - exp >= 0 ? 'good' : 'bad'}">Net: ${fmt$(inc - exp)}</div>`;
  const ys = Object.keys(G.fin).map(Number).filter(y => y < G.yr).sort((a, b) => b - a);
  if (ys.length) o += '<h3 class="sub">Past seasons</h3>' + ys.map(y => { const F = G.fin[y]; const i = Object.values(F.inc).reduce((a, b) => a + b, 0), e = Object.values(F.exp).reduce((a, b) => a + b, 0); return `<div class="erow"><div>${y}</div><div class="${i - e >= 0 ? 'good' : 'bad'}">${fmtK(i)} in · ${fmtK(e)} out · <b>${fmtK(i - e)}</b></div></div>`; }).join('');
  if (G.trophies.length) o += '<h2 class="sec">Trophy room</h2>' + G.trophies.map(t => `<div class="erow"><div>🏆 <b>${esc(t.t)}</b><div class="hs">${t.yr} · ${esc(t.h)}</div></div></div>`).join('');
  o += '<h2 class="sec">News</h2>' + G.news.slice(0, 40).map(n => `<div class="news ${n.type}"><span>${shortDate(...awToYW(n.aw))}</span>${esc(n.t)}</div>`).join('');
  if (G.history.length) o += '<h3 class="sub">Horses that have left</h3>' + G.history.slice(-25).reverse().map(x => `<div class="news"><span>${x.yr}</span>${esc(x.name)} — ${esc(x.out)}</div>`).join('');
  o += `<h2 class="sec">Game</h2><div class="card"><div class="hs">Difficulty: <b>${DIFF[G.diff].label}</b> · Save: <b id="savestat">${cloud.status === 'cloud' ? 'saved to your account' : 'saved in this browser'}</b></div><div class="btnrow"><button class="btn ghost sm" data-a="help">How to play</button><button class="btn ghost sm" data-a="saveHelp">How saving works</button></div>
  <div class="btnrow"><button class="btn sm" data-a="dlBackup">⬇️ Save backup file</button><button class="btn ghost sm" data-a="ulBackup">⬆️ Load backup file</button><input type="file" id="bkfile" accept=".json,application/json,text/plain" hidden></div>
  <div class="btnrow"><button class="btn ghost sm" data-a="export">Copy save code</button><button class="btn ghost sm" data-a="import">Paste save code</button><button class="btn ghost sm" data-a="snaps">Restore a snapshot</button><button class="btn ghost sm danger" data-a="newgame">New game</button></div><div class="hs">Last backup file: ${G.lastBackup ? shortDate(...awToYW(G.lastBackup)) : 'never'}</div></div>`;
  return o;
}
function helpHtml() {
  return `<div class="help"><p><b>The loop:</b> each tap of <i>Advance week</i> runs your entered races, pays the bills, ages the horses and moves the calendar. The racing calendar, sales and stakes follow the real US season.</p>
  <p><b>Buying:</b> state-bred & lower-book sales are cheap and full of state-bred runners; Keeneland Book 1, Saratoga Select and the Fasig-Tipton Gulfstream 2yo sale are where the elite pedigrees go. Pay for a vet review to dodge unsound horses and an agent's inspection for a read on talent. You can also buy privately or claim a horse.</p>
  <p><b>Racing:</b> break the maiden (MSW or maiden claiming), then climb: claiming → allowance (N1X, N2X) → optional claimers → stakes → graded stakes. State-breds have restricted races with richer purses for the quality. "Par" is the field's typical figure — compare it with your horse's figures.</p>
  <p><b>Trainers:</b> better barns develop horses closer to their ceiling, keep them sounder, read them better (their comments get more accurate) and attract better jockeys. Elite barns are picky.</p>
  <p><b>Health:</b> run too often and injuries come. Turn horses out to recover. Bleeders improve on Lasix, but 2yo races and stakes are Lasix-free.</p>
  <p><b>The Derby:</b> nominate your 3yo colts to the Triple Crown in January ($600, or $6,000 late). Earn points in the prep races to make the 20-horse field.</p>
  <p><b>Breeding:</b> book mares Feb–June. The foal's ability comes from both parents plus a lot of luck; nick ratings show which sire lines cross well. Foals are state-bred where the mare foals, so moving a mare to New York or Pennsylvania opens rich state-bred programs. Sire fees rise or fall once their first crops race.</p>
  <p><b>Stud or race on?</b> After a big 3yo season farms make syndication offers. Racing at 4 can raise his value (older-horse G1 wins count extra) — or an injury or a few losses can sink it.</p>
  <p><b>Big races:</b> the full 2026 US stakes calendar (600+ graded & listed races) with real age conditions — early-season older-horse races are 4&up. New York races at Belmont year-round except the Saratoga summer meet. The Saudi Cup (Feb) and Dubai World Cup (Mar) are invitation-only; win the Pegasus to get the Saudi invite.</p>
  <p><b>Ownership tools:</b> sell shares to partners to spread risk, insure valuable horses (about 3.5% a year), shuttle stallions to Australia for a second season, and buy lifetime stallion shares or no-guarantee seasons.</p>
  <p><b>State-bred bonuses:</b> NY, PA, FL, MD, CA and LA-breds earn owner bonuses on top of purses in their home state, and Kentucky-breds get KTDF supplements in Kentucky (big ones at Kentucky Downs). Rates are approximations of the real programs.</p>
  <p><b>Selling:</b> consign to a sale (set a reserve), take a private offer, or sell to a trader at a discount. Pinhooking — buying weanlings and reselling as yearlings or 2yos — is a real way to profit.</p></div>`;
}

// ---------- WEEK REPORT ----------
function openReport(rep) {
  rep = rep || G.lastRep; if (!rep) return;
  let o = '';
  if (rep.races.length) o += rep.races.map((res, i) => res.mine.map(m => `<div class="resc ${m.fin === 1 ? 'win' : m.fin <= 3 ? 'itm' : ''}"><div class="resc-h"><span class="fpos">${ordinal(m.fin)}</span><div><b>${esc(m.name)}</b><div class="hs">${esc(res.label)} · ${TRACKS[res.trk].n} · ${distStr(res.dist)} ${SURF_N[res.surf].toLowerCase()}</div></div></div>
  <div class="hs">${m.fin === 1 ? `Won by ${lenStr(res.runners[1]?.btn || 0)}` : `Beaten ${lenStr(m.btn)}`} · fig <b>${m.fig}</b> · ${oddsStr(m.odds)} · ${esc(m.comment)}${m.share ? ` · <b class="good">${fmt$(m.share)}</b>` : ''}${m.bonus ? ` + breeder award ${fmt$(m.bonus)}` : ''}${m.bet ? (m.betRet ? ` · bet paid ${fmt$(m.betRet)}` : ` · lost ${fmt$(m.bet)} bet`) : ''}</div>
  <button class="btn sm" data-a="watch" data-i="${i}">▶ Watch the race</button></div>`).join('') || `<div class="resc"><b>Claim race:</b> ${esc(res.label)} at ${TRACKS[res.trk].n} <button class="btn sm" data-a="watch" data-i="${i}">▶ Watch</button></div>`).join('');
  o += rep.news.length ? '<h3 class="sub">This week</h3>' + rep.news.map(n => `<div class="news ${n.type}">${esc(n.t)}</div>`).join('') : '<p class="pad muted">A quiet week at the barn.</p>';
  o += '<button class="btn big" data-a="close">Continue</button>';
  UI.rep = rep;
  openModal(`Week of ${shortDate(rep.yr, rep.wk)}, ${rep.yr}`, o, { push: false });
}
function watchRace(i) {
  const res = UI.rep.races[i];
  openModal('🏁 ' + TRACKS[res.trk].n, '<div class="racehost"></div>');
  const host = $('.racehost'); UI.anim = playRace(host, res);
}

  consignPick: d => { const h = horse(d.id); const up = []; for (let i = 0; i < 40; i++) { const [yr, wk] = wkOff(i); const s = SALES.find(x => x.wk === wk); if (s) up.push([s, yr, wk]); }

  moveFarm: d => { const h = horse(d.id); openModal('Move ' + esc(h.name), '<div class="note muted">Foals are registered as state-breds where they are foaled. Moving costs $2,000.</div>' + FARM_STATES.filter(s => s !== h.farm).map(s => `<div class="erow"><div><b>${STATE_N[s]}</b><div class="hs">Board ${fmt$(BOARD_RATE[s])}/day${SB_STATES.includes(s) ? ' · state-bred program' : ''}</div></div><button class="btn sm" data-a="doMove" data-id="${h.id}" data-s="${s}">Move</button></div>`).join('')); },
  doMove: d => { const h = horse(d.id); h.farm = d.s; spend('Shipping', 2000); toast('Moved to ' + STATE_N[d.s]); UI.stack.pop(); openHorse(h.id, true); scheduleSave(); },
  studFee: d => { const h = horse(d.id); const s = stallion(h.sid); const m = s.mkt; const opts = [0.6, 0.8, 1, 1.25, 1.5].map(x => Math.max(1000, Math.round(m * x / 500) * 500)); openModal('Stud fee for ' + esc(h.name), `<div class="note muted">Market fee ~${fmt$(Math.round(m / 500) * 500)}. Price above market and fewer breeders book; below and you fill his book. Revenue is collected each July (live foals, less 25% farm management).</div>` + opts.map(f => `<div class="erow"><div><b>${fmt$(f)}</b><div class="hs">~${clamp(Math.round(110 * Math.pow(m / f, 1.6)), 3, 175)} mares expected</div></div><button class="btn sm" data-a="doFee" data-id="${h.id}" data-f="${f}">Set</button></div>`).join('')); },
  doFee: d => { const h = horse(d.id); stallion(h.sid).fee = +d.f; toast('Fee set to ' + fmt$(+d.f)); UI.stack.pop(); openHorse(h.id, true); scheduleSave(); },
  sellStud: d => { const h = horse(d.id); const v = Math.round(stallion(h.sid).mkt * 300 * (h.studShare || 1) * (G.yr - h.foal > 15 ? 0.4 : 1)); confirmBox(`Sell your ${(h.studShare || 1) * 100}% of ${esc(h.name)} for ${fmt$(v)}?`, 'Sell', 'doSellStud', { id: h.id, v }); },
  doSellStud: d => { const h = horse(d.id); earn('Stallion sales', +d.v); const s = stallion(h.sid); if (s) s.pid = null; G.history.push({ name: h.name, out: 'Stallion sold ' + fmt$(+d.v), yr: G.yr }); removeHorse(h.id); closeModal(); scheduleSave(); },
  rsub: d => { UI.rsub = d.t; render(); }, rh: d => { UI.rh = d.id; render(); }, rw: d => { UI.rw = +d.w; render(); }, rsurf: d => { UI.rsurf = d.k; render(); }, rhHide: () => { UI.rhHide = !UI.rhHide; render(); },
  race: d => openRace(d.rid), viewField: d => { getField(raceById(d.rid)); openRace(d.rid, true); },
  enterForm: d => openEnter(d.id, d.rid),
  doEnter: d => { const jk = document.querySelector('input[name=jk]:checked'); const h = horse(d.id); const r = raceById(d.rid); const bet = +$('#en-bet').value; if (bet > G.cash) return toast('Not enough cash for that bet'); const err = enterRace(h, r, { jk: jk ? +jk.value : 1, jkName: jk?.dataset.n, lasix: $('#en-lasix')?.checked, bet }); if (err) return toast(err); const e = G.entries[G.entries.length - 1]; e.jkName = jk?.dataset.n; toast(`${h.name} entered!`); UI.stack.pop(); openRace(d.rid, true); scheduleSave(); },
  scratch: d => { scratch(d.id, d.rid); toast('Scratched'); if (!$('#modal').classList.contains('hidden')) refreshModal(); render(); scheduleSave(); },
  claimbox: () => { UI.tab = 'races'; UI.rsub = 'claim'; render(); },
  claimForm: d => openClaimForm(d.rid, +d.i),
  doClaim: d => { const r = raceById(d.rid); if (G.cash < r.clm) return toast('Not enough cash'); G.claims.push({ rid: d.rid, idx: +d.i, tid: $('#cl-t').value }); toast('Claim slip dropped'); UI.stack.pop(); openRace(d.rid, true); scheduleSave(); },
  unclaim: d => { G.claims = G.claims.filter(c => !(c.rid === d.rid && c.idx === +d.i)); render(); scheduleSave(); },
  lot: d => openLot(+d.i),
  lotVet: d => { const l = G.saleLots[+d.i]; spend('Vet & surgery', 500); l.vet = true; openLot(+d.i, true); scheduleSave(); },
  lotAgent: d => { const l = G.saleLots[+d.i]; spend('Bloodstock agent', agentFee(l.h)); l.agent = true; openLot(+d.i, true); scheduleSave(); },
  auction: d => openAuction(+d.i),
  bid: d => { const l = G.saleLots[+d.i]; const A = l.auc; const nxt = A.cur + bidInc(A.cur); if (nxt > G.cash) return toast('Not enough cash'); A.cur = nxt; A.mine = true; A.log.push(`${fmt$(nxt)} — YOUR BID`); openAuction(+d.i, true); setTimeout(() => { if (!G.saleLots || !G.saleLots[+d.i] || !G.saleLots[+d.i].auc) return; if (aiRespond(l)) { openAuction(+d.i, true); } else { A.log.push('Going once… going twice…'); openAuction(+d.i, true); setTimeout(() => { if (l.auc) hammer(+d.i); }, 900); } }, 700); },
  bidMax: d => { const l = G.saleLots[+d.i]; const A = l.auc; const max = Math.min(+$('#auc-max').value || 0, G.cash); let guard = 0; while (guard++ < 400) { if (!A.mine) { const nxt = A.cur + bidInc(A.cur); if (nxt > max) break; A.cur = nxt; A.mine = true; } if (!aiRespond(l)) break; } if (A.mine) { A.log.push(`Your agent holds the bid at ${fmt$(A.cur)}`); hammer(+d.i); } else { A.log.push(`Your max ${fmt$(max)} was topped.`); hammer(+d.i); } },
  hammer: d => hammer(+d.i),
  mkt: d => { const h = G.market[+d.i]; openModal(esc(h.name), `<div class="ped"><div><span>Sire</span><b>${esc(h.sireName)}</b></div><div><span>Dam</span><b>${esc(h.damName)}</b> <small>by ${esc(h.damsireName)}</small></div></div><dl class="kv"><dt>Age/sex</dt><dd>${ageOf(h)}yo ${sexLabel(h)} · ${h.bred}-bred</dd><dt>Record</dt><dd>${rec(h)} · ${fmt$(h.earn)}</dd><dt>Recent figs</dt><dd>${h.pp.map(p => p.fig).join(', ') || '—'}</dd><dt>Conditions</dt><dd>${h.wins ? `Won ${h.alw} allowance race(s)` : 'Maiden'}</dd><dt>Asking</dt><dd><b>${fmt$(h.ask)}</b></dd></dl><label class="lab">Trainer</label><select id="mk-t" class="inp">${G.trainers.filter(t => trainerAccepts(t, h)).map(t => `<option value="${t.id}" ${t.id === defaultTrainer() ? 'selected' : ''}>${esc(t.n)} · ${TRAINER_TIERS[t.tier].n} · ${REGION_N[t.rg]} · ${fmt$(t.rate)}/day</option>`).join('')}</select><button class="btn big" data-a="mktBuy" data-i="${d.i}">Buy for ${fmt$(h.ask)}</button>`); },
  mktBuy: d => { const h = G.market[+d.i]; if (G.cash < h.ask) return toast('Not enough cash'); spend('Horse purchases', h.ask); h.boughtFor = h.ask; h.trainer = $('#mk-t').value; G.lastTrainer = h.trainer; h.ceil += D().luck; G.horses.push(h); G.market.splice(+d.i, 1); news(`You bought ${h.name} privately for ${fmt$(h.ask)}.`, 'good'); toast('Welcome to the barn, ' + h.name); closeModal(); scheduleSave(); },
  bsub: d => { UI.bsub = d.t; render(); }, bst: d => { UI.bst = d.s; render(); }, stud: d => openStud(d.sid),
  help: () => openModal('How to play', helpHtml()),
  saveHelp: () => openModal('How saving works', `<div class="help"><p><b>Automatic:</b> the game saves on this device after every week and every action. ${cloud.status === 'cloud' ? 'Inside Claude it also saves to your Claude account.' : 'On the home-screen app it is stored in that app\'s own storage and works offline.'}</p><p><b>What can wipe it:</b> deleting the home-screen app, clearing Safari website data, or (for a regular Safari tab you don\'t open for weeks) Safari\'s storage clean-up. The Claude version and the home-screen version keep separate saves.</p><p><b>Snapshots:</b> every 13 weeks the game keeps a snapshot (last 6) you can roll back to.</p><p><b>Backups:</b> tap <i>Save backup file</i> now and then — it goes to your Files app / Downloads. <i>Load backup file</i> restores it on any device. The copy/paste save code does the same thing without files.</p></div>`),
  dlBackup: () => { if (window.claude) return ACT.export(); const s = serialize(); try { const blob = new Blob([s], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `turf-tycoon-${G.yr}-wk${G.wk}.json`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); G.lastBackup = AW(); scheduleSave(); toast('Backup file saved'); } catch (e) { ACT.export(); } },
  ulBackup: () => { const f = $('#bkfile'); f.value = ''; f.onchange = () => { const file = f.files[0]; if (!file) return; const rd = new FileReader(); rd.onload = () => { try { let t = String(rd.result).trim(); if (t[0] !== '{') t = decodeURIComponent(escape(atob(t))); loadFromString(t); saveNow(); render(); toast('Backup loaded'); } catch (e) { toast('That file didn\'t work'); } }; rd.readAsText(file); }; f.click(); },
  snaps: () => { const L = getSnaps(); openModal('Snapshots', L.length ? '<div class="note muted">Roll back to an earlier point. Your current game is kept as a snapshot first.</div>' + L.slice().reverse().map((x, i) => `<div class="erow"><div><b>${x.label}</b><div class="hs">${x.n} horses · ${fmtK(x.cash)}</div></div><button class="btn sm" data-a="snapRestore" data-i="${L.length - 1 - i}">Restore</button></div>`).join('') : '<p class="pad muted">No snapshots yet — one is taken every 13 weeks.</p>'); },
  snapRestore: d => { const L = getSnaps(); const x = L[+d.i]; if (!x) return; pushSnap('Before restore'); loadFromString(x.data); saveNow(); closeModal(); toast('Restored ' + x.label); },
  partner: d => { const h = horse(d.id); const v = marketValue(h); const opts = [0.25, 0.5].filter(f => OWN(h) - f >= 0.25 - 1e-9); openModal('Sell a share of ' + esc(dispName(h)), `<div class="note muted">Partners pay 95% of market value for their share, then split all bills, fees and earnings with you. Lower risk, smaller upside.</div>` + opts.map(f => `<div class="erow"><div><b>Sell ${f * 100}%</b><div class="hs">You'd keep ${Math.round((OWN(h) - f) * 100)}% · receive ${fmt$(Math.round(v * f * 0.95 / 500) * 500)}</div></div><button class="btn sm" data-a="doPartner" data-id="${h.id}" data-f="${f}">Sell</button></div>`).join('')); },
  doPartner: d => { const h = horse(d.id); const p = sellPartner(h, +d.f); toast('Partners paid ' + fmt$(p)); UI.stack.pop(); openHorse(h.id, true); scheduleSave(); },
  insBuy: d => { const h = horse(d.id); const p = buyIns(h); toast(`Insured for ${fmt$(h.ins.val)} (premium ${fmt$(p)})`); openHorse(h.id, true); scheduleSave(); },
  insToggle: d => { const h = horse(d.id); h.ins.auto = !h.ins.auto; openHorse(h.id, true); scheduleSave(); },
  shuttle: d => { const h = horse(d.id); h.shuttle = !h.shuttle; toast(h.shuttle ? 'Booked to shuttle in August (~$30k shipping)' : 'Shuttle cancelled'); openHorse(h.id, true); scheduleSave(); },
  buyShare: d => { const s = stallion(d.sid); if (G.cash < shareCost(s)) return toast('Not enough cash'); buyShare(s); toast('You now own a share of ' + s.name); openStud(d.sid, true); scheduleSave(); },
  sellShare: d => { const p = sellShare(d.sid); toast('Share sold for ' + fmt$(p)); openStud(d.sid, true); scheduleSave(); },
  export: () => { const s = serialize(); const code = btoa(unescape(encodeURIComponent(s))); openModal('Export save', `<p class="pad muted">Copy this code somewhere safe. Paste it into Import on any device to restore your stable.</p><textarea class="inp code" readonly>${code}</textarea><button class="btn big" data-a="copyCode">Copy</button>`); },
  copyCode: () => { const t = $('textarea.code'); t.select(); (navigator.clipboard?.writeText(t.value) || Promise.reject()).then(() => toast('Copied'), () => toast('Select the text and copy it manually')); },
  import: () => openModal('Import save', '<textarea id="imp" class="inp code" placeholder="Paste your save code"></textarea><button class="btn big" data-a="doImport">Load</button>'),
  doImport: () => { try { const s = decodeURIComponent(escape(atob($('#imp').value.trim()))); loadFromString(s); closeModal(); saveNow(); toast('Save loaded'); render(); } catch (e) { toast('That code didn\'t work'); } },
  newgame: () => confirmBox('Start a new game? Your current stable will be erased (export it first if you want to keep it).', 'Start over', 'doNew'),
  doNew: () => { G = null; try { localStorage.removeItem(SAVE_KEY); } catch (e) { } cloudDelete(); closeModal(); render(); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') return;
  const a = el.dataset.a; if (!ACT[a]) return; e.preventDefault(); e.stopPropagation();
  try { ACT[a](el.dataset, el); } catch (err) { console.error(err); toast('Oops: ' + err.message); }
});
document.addEventListener('change', e => { const el = e.target.closest('input[type=checkbox][data-a]'); if (!el) return; const a = el.dataset.a; if (ACT[a]) ACT[a](el.dataset, el); });

// ---------- SAVE ----------
let saveT = null;
function scheduleSave() { clearTimeout(saveT); saveT = setTimeout(saveNow, 700); renderTop(); }
const SNAP_KEY = 'turf_tycoon_snaps';
function getSnaps() { try { return JSON.parse(localStorage.getItem(SNAP_KEY) || '[]'); } catch (e) { return []; } }
function pushSnap(label) { try { const L = getSnaps(); L.push({ label: label || `${shortDate(G.yr, G.wk)}, ${G.yr}`, aw: AW(), n: G.horses.length, cash: G.cash, data: serialize() }); while (L.length > 6) L.shift(); localStorage.setItem(SNAP_KEY, JSON.stringify(L)); } catch (e) { try { const L = getSnaps(); L.splice(0, 2); localStorage.setItem(SNAP_KEY, JSON.stringify(L)); } catch (e2) { } } }
function saveNow() {
  if (!G) return; const s = serialize();
  try { localStorage.setItem(SAVE_KEY, s); } catch (e) { }
  if (AW() % 13 === 0 && G.lastSnap !== AW()) { G.lastSnap = AW(); pushSnap(); }
  cloudSave(s);
}
async function cloudInit() {
  try {
    if (!window.claude || !window.claude.use) return;
    const user = await window.claude.use('user'); const db = await window.claude.use('db'); if (!user || !db) return;
    const uid = await user.id(); if (!uid) return;
    cloud.db = db; cloud.uid = uid;
    const meta = await db.doc('data/users/' + uid + '/meta').get();
    if (meta.exists) {
      const m = meta.data(); const localAt = G ? (G.savedAt || 0) : 0;
      if (m.savedAt > localAt + 1000) {
        let s = ''; for (let i = 0; i < m.n; i++) { const c = await db.doc('data/users/' + uid + '/save' + i).get(); if (!c.exists) throw new Error('chunk'); s += c.data().d; }
        loadFromString(s); try { localStorage.setItem(SAVE_KEY, s); } catch (e) { } render(); toast('Loaded your saved stable');
      }
    }
    cloud.status = 'cloud'; const ss = $('#savestat'); if (ss) ss.textContent = 'saved to your account';
    if (G) saveNow();
  } catch (e) { console.warn('cloud', e); }
}
async function cloudSave(s) {
  if (!cloud.db) return; if (cloud.busy) { cloud.pending = s; return; } cloud.busy = true;
  try {
    const CH = 180000; const n = Math.ceil(s.length / CH);
    for (let i = 0; i < n; i++) await cloud.db.doc('data/users/' + cloud.uid + '/save' + i).set({ d: s.slice(i * CH, (i + 1) * CH) });
    await cloud.db.doc('data/users/' + cloud.uid + '/meta').set({ n, savedAt: JSON.parse(s).savedAt || Date.now(), v: 1 });
  } catch (e) { console.warn('cloud save', e); }
  cloud.busy = false; if (cloud.pending) { const p = cloud.pending; cloud.pending = false; cloudSave(p); }
}
async function cloudDelete() { if (!cloud.db) return; try { await cloud.db.doc('data/users/' + cloud.uid + '/meta').delete(); } catch (e) { } }

// ---------- BOOT ----------
function boot() {
  try { const s = localStorage.getItem(SAVE_KEY); if (s) loadFromString(s); } catch (e) { G = null; }
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  $('.x').onclick = closeModal; $('#back').onclick = backModal;
  render();
  setTimeout(cloudInit, 50);
}

boot();
try { if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {}); if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { }
</script>
</body>
